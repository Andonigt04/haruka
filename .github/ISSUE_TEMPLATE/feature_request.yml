name: Feature, panel or adapter proposal
description: Propose a feature, a panel, or support for another engine
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what stops you today.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it would live
      options: [Core (engine-free), A backend, A plugin, Remote protocol, Not sure]
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it would work. Does it change a versioned contract (backend, plugin, remote protocol)?
